interface:
  display_name: "展会市场调研"
  short_description: "面向国际会展企业的企业、市场、买家与展会深度调研分析"
  default_prompt: "请围绕这家企业或产品的市场进入决策，按对象执行数据源路由：买家、渠道、市场商机/利好/反证、HS/准入先联网并保存正文截图，再预检对应库内入口并交叉验证；同行、历史参展和关联项目先查库内，再联网解读。库内买家检索能力不可靠时阻塞正式买家推荐，不凑数；输出结论先行、带截图/链接/来源解读/反证的正式市场分析飞书云文档。准入章节先给可进入/条件进入/暂缓报价判断；展会只推荐首次适配时配置的当前有效且产品/国家匹配项目，行动建议主体是研究对象企业，不生成以关联会展企业命名的切入方案；信息不足时输出市场验证报告或市场机会探索简报。"
